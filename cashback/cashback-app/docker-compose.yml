services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cashback-app
    container_name: cashback-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - postgres
      - redis
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cashback
      DB_USERNAME: cashback
      DB_PASSWORD: secret

  nginx:
    image: nginx:alpine
    container_name: cashback-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: cashback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashback
      POSTGRES_USER: cashback
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: cashback-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
